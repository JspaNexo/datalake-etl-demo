name: datalake-demo

services:
  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD", "/seqsvr/Client/seqcli", "node", "health", "-s", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_demo_2026}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_demo_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ventas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  source_postgres:
    image: datalake-source-postgres:16.13-alpine
    build:
      context: .
      dockerfile: Dockerfile.source-postgres
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER:-operacion}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD:-operacion_demo_2026}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB:-ventas_origen}
    ports:
      - "127.0.0.1:${SOURCE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - source_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  dagster:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-datalake_demo}
      APP_ENV: ${APP_ENV:-demo}
      SOURCE_PATH: ${SOURCE_PATH:-data/ventas.csv}
      SOURCE_POSTGRES_HOST: source_postgres
      SOURCE_POSTGRES_PORT: "5432"
      SOURCE_POSTGRES_DB: ${SOURCE_POSTGRES_DB:-ventas_origen}
      SOURCE_POSTGRES_USER: ${SOURCE_POSTGRES_USER:-operacion}
      SOURCE_POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD:-operacion_demo_2026}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEQ_URL: http://seq:5341
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_TIMEOUT_SECONDS: ${SEQ_TIMEOUT_SECONDS:-5}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_demo_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-datalake}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_demo_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ventas}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./logs:/app/logs
      - dagster_data:/var/lib/dagster
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_healthy
      source_postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["datalake-log-worker"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_NAME: ${APP_NAME:-datalake_demo}
      APP_ENV: ${APP_ENV:-demo}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      WORKER_LOG_FILE_NAME: ${WORKER_LOG_FILE_NAME:-worker_log.txt}
      SEQ_URL: http://seq:5341
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_TIMEOUT_SECONDS: ${SEQ_TIMEOUT_SECONDS:-5}
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    depends_on:
      seq:
        condition: service_healthy

  sqlpad:
    image: sqlpad/sqlpad:7.5.7
    environment:
      SQLPAD_ADMIN: ${SQLPAD_ADMIN:-demo@example.com}
      SQLPAD_ADMIN_PASSWORD: ${SQLPAD_ADMIN_PASSWORD:-sqlpad_demo_2026}
      SQLPAD_CONNECTIONS__gold__name: Gold - Ventas
      SQLPAD_CONNECTIONS__gold__driver: postgres
      SQLPAD_CONNECTIONS__gold__host: postgres
      SQLPAD_CONNECTIONS__gold__port: "5432"
      SQLPAD_CONNECTIONS__gold__database: ${POSTGRES_DB:-ventas}
      SQLPAD_CONNECTIONS__gold__username: ${POSTGRES_USER:-demo}
      SQLPAD_CONNECTIONS__gold__password: ${POSTGRES_PASSWORD:-postgres_demo_2026}
      SQLPAD_DEFAULT_CONNECTION_ID: gold
      SQLPAD_CONNECTIONS__source__name: Origen - Operacion
      SQLPAD_CONNECTIONS__source__driver: postgres
      SQLPAD_CONNECTIONS__source__host: source_postgres
      SQLPAD_CONNECTIONS__source__port: "5432"
      SQLPAD_CONNECTIONS__source__database: ${SOURCE_POSTGRES_DB:-ventas_origen}
      SQLPAD_CONNECTIONS__source__username: ${SOURCE_POSTGRES_USER:-operacion}
      SQLPAD_CONNECTIONS__source__password: ${SOURCE_POSTGRES_PASSWORD:-operacion_demo_2026}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - sqlpad_data:/var/lib/sqlpad
    depends_on:
      postgres:
        condition: service_healthy
      source_postgres:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  dagster_data:
  sqlpad_data:
  seq_data:
  source_postgres_data:
